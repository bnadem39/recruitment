spring.application.name=recrutment

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:true}
spring.docker.compose.readiness.timeout=1m
server.port=${SERVER_PORT}
spring.docker.compose.enabled=false

# JWT_SECRET must be Base64-encoded and contain at least 32 random bytes.
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
security.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,http://10.*:*,http://172.*:*,http://192.168.*:*}

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
app.oauth2.frontend-redirect-uri=${FRONTEND_OAUTH_REDIRECT:http://localhost:5173/}

# Email verification
app.email-verification.base-url=${EMAIL_VERIFICATION_BASE_URL:http://localhost:8080}
app.email-verification.expiration-minutes=${EMAIL_VERIFICATION_EXPIRATION_MINUTES:5}
app.email-verification.from=${EMAIL_VERIFICATION_FROM:${SPRING_MAIL_USERNAME:${MAIL_USERNAME:}}}
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:${MAIL_USERNAME:}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}

webrtc.stun-urls=${WEBRTC_STUN_URLS:stun:stun.l.google.com:19302}
webrtc.turn-url=${WEBRTC_TURN_URL:}
webrtc.turn-username=${WEBRTC_TURN_USERNAME:}
webrtc.turn-credential=${WEBRTC_TURN_CREDENTIAL:}
webrtc.join-window-before-minutes=${WEBRTC_JOIN_WINDOW_BEFORE_MINUTES:30}
webrtc.join-window-after-minutes=${WEBRTC_JOIN_WINDOW_AFTER_MINUTES:60}
